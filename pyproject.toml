[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-scorecard"
version = "1.0.0"
description = "Lauki Finance credit risk scorecard - PD, credit score and rating for loan applications"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.62.0",
    "altair==6.2.2",
    "pandas==3.0.5",
    "numpy==2.5.2",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

# The stylesheet is a runtime asset, not just a source file.
[tool.setuptools.package-data]
"credit_risk.ui" = ["assets/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# The house convention is `should_<action>_with<Condition>_<expectedResult>`.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["should_*", "test_*"]
markers = ["integration: touches the real model artifact on disk"]
filterwarnings = ["ignore::UserWarning:sklearn.base"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C90", "SIM", "RET", "ARG", "PTH", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# The mandated test convention is `should_<action>_with<Condition>_<result>`,
# which is intentionally not snake_case, and fixtures make annotations noise.
"tests/*" = ["ANN", "ARG", "N802", "SLF001"]
# `X` / `Xtr` for design matrices is universal scikit-learn convention and
# clearer to ML readers than a snake_case rename would be.
"scripts/*" = ["N806"]

[tool.mypy]
# numpy's bundled stubs use PEP 695 `type` statements, so the checked version
# must be 3.12+ even though the package supports 3.11 at runtime.
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
# `disallow_any_explicit` is deliberately off: `np.ndarray` is generic over
# `Any` by design, and pydantic's `BaseModel` metaclass is likewise untyped.
# Enabling it flags the libraries, not our code. `strict = true` still bans
# implicit Any, untyped defs and untyped calls in our own modules.
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "altair.*", "streamlit.*", "pandas.*"]
ignore_missing_imports = true
